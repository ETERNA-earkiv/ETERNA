# Kortlivad stack för regressionstester. Speglar deploys/standalone/docker-compose.yaml.
# Håll images och miljövariabler i synk med den filen. Varje image kan överstyras
# med en miljövariabel för att testa en uppgradering, t.ex. SOLR_IMAGE=solr:9.11.0.
name: eterna-regression

services:
  zoo:
    image: ${ZOOKEEPER_IMAGE:-ghcr.io/eterna-earkiv/zookeeper:3.9.5}
    environment:
      - ZOO_4LW_COMMANDS_WHITELIST=mntr,conf,ruok
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  solr:
    image: ${SOLR_IMAGE:-ghcr.io/eterna-earkiv/solr:9.10.1}
    user: "8983"
    environment:
      SOLR_HEAP: 2g
      ZK_HOST: zoo:2181
    command: -c
    depends_on:
      zoo:
        condition: service_healthy
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD", "solr", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  clamd:
    image: ${CLAMAV_IMAGE:-docker.io/clamav/clamav:stable}
    volumes:
      - clam_data:/var/lib/clamav
      - roda_data:/roda/data/
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  siegfried:
    image: ${SIEGFRIED_IMAGE:-ghcr.io/eterna-earkiv/siegfried:v1.11.4}
    environment:
      SIEGFRIED_HOST: 0.0.0.0
      SIEGFRIED_PORT: 5138
    volumes:
      - siegfried_data:/home/siegfried/
      - roda_data:/roda/data/
    healthcheck:
      test: ["CMD", "sf", "-v"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  openldap:
    image: ${OPENLDAP_IMAGE:-docker.io/bitnamilegacy/openldap:2.6.10}
    user: 1001:root
    environment:
      - LDAP_ROOT=dc=roda,dc=org
      - LDAP_SKIP_DEFAULT_TREE=yes
      - LDAP_ADMIN_PASSWORD=eterna
      - LDAP_EXTRA_SCHEMAS=cosine,inetorgperson,nis,pbkdf2
    volumes:
      - ../../deploys/standalone/ldap/ldif/pbkdf2.ldif:/opt/bitnami/openldap/etc/schema/pbkdf2.ldif:ro
      - openldap_data:/bitnami/openldap
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -H ldap://localhost:1389 -D cn=admin,dc=roda,dc=org -w $$LDAP_ADMIN_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  unoserver:
    image: ${UNOSERVER_IMAGE:-ghcr.io/eterna-earkiv/eterna-unoserver:v3.7.0}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2003 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Deploy-compose saknar postgres, men ETERNA 1.0.0 kräver en databas (annars blir
  # /actuator/health aldrig UP). Uppgifter enligt application.properties.
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:17}
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: roda
      POSTGRES_DB: roda_core_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d roda_core_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Finns inte i deploy-compose, men ETERNA:s SMTP_HOST pekar på "mailserver".
  mailserver:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.24}

  eterna:
    image: ${ETERNA_IMAGE:-ghcr.io/eterna-earkiv/eterna:v1.0.0}
    ports:
      - "${ETERNA_PORT:-8080}:8080"
    # Imagens egen healthcheck anropar /api/v2/openapi redan under uppstart. Då
    # initieras InternalApiAuthFilter (OnOffFilter) innan konfigurationen är laddad
    # och blir permanent AV, så all basic auth ignoreras (alla anrop blir "guest").
    # Därför kollar vi /actuator/health i stället, som inte ligger under /api/*.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      solr:
        condition: service_healthy
      clamd:
        condition: service_healthy
      siegfried:
        condition: service_healthy
      openldap:
        condition: service_healthy
      unoserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started
    volumes:
      - roda_data:/roda/data/
      - ../../deploys/standalone/roda/config/roda-core.properties:/roda/config/roda-core.properties:ro
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/roda_core_db
      - RODA_CORE_SOLR_TYPE=CLOUD
      - RODA_CORE_SOLR_CLOUD_URLS=zoo:2181
      - SOLR_NUM_SHARDS=4
      - SOLR_REPLICATION_FACTOR=1
      - SIEGFRIED_SERVER_URL=http://siegfried:5138
      - CLAMD_TCPADDR=clamd
      - CLAMD_TCPSOCKET=3310
      - SMTP_HOST=mailserver
      - SMTP_PORT=1025
      - UNOSERVER_HOST=unoserver
      - UNOSERVER_PORT=2003

volumes:
  zookeeper_data:
  zookeeper_datalog:
  solr_data:
  clam_data:
  siegfried_data:
  roda_data:
  openldap_data:
  pg_data:
