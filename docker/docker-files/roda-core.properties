# Docker-specific overrides for roda-core.properties.
#
# This file is placed at $RODA_HOME/config/roda-core.properties, which
# RodaCoreFactory loads before the defaults bundled inside roda-core-*.jar
# (external config takes precedence via MergeCombiner).
#
# Only settings that differ from the JAR defaults are listed here.
#
# ClamAV: use --fdpass so clamd can read files directly from the bind-mounted
# storage volume. The bundled default uses --stream, which sends file content
# over the socket and does not require clamd to have direct filesystem access.
# In the Docker deployment clamd shares the same storage mount, so --fdpass
# is more efficient and avoids streaming overhead.
core.plugins.internal.virus_check.clamav.bin = /usr/bin/clamdscan
core.plugins.internal.virus_check.clamav.params = -m --fdpass
core.plugins.internal.virus_check.clamav.get_version = clamdscan --version
