##################### ETERNA Core configuration file #######################
#                                                                        #
# This file contains all the configurations and settings of ETERNA CORE.   #
# Settings are very broad and range from the configuration of            #
# external authentication systems to some internal plugin configurations.#
#                                                                        #
# In most cases, commented lines represent the default values that are   #
# being used. To change the behaviour, uncomment the line and set its    #
# property value.                                                        #
#                                                                        #
# More details are given below closer to each section                    #
#                                                                        #
# NOTE: Be sure to edit this file in UTF-8 encoding                      #
#                                                                        #
##########################################################################


##########################################################################
# LDAP settings
#
# Requires an external OpenLDAP server. In Docker deployments the
# bundled OpenLDAP container is used (see docker-compose-dev.yaml).
#
# core.ldap.url / core.ldap.port
#    Connection to the LDAP server. Read from environment variables so
#    that the actual host/port is set in docker-compose or the deployment
#    environment, not in this file.
#
# core.ldap.adminDN / core.ldap.adminPassword
#    Bind credentials for ETERNA's internal LDAP operations.
#    WARNING: Change adminPassword from the default "eterna" before
#    deploying to any environment. Preferably inject via environment
#    variable: core.ldap.adminPassword = ${env:LDAP_ADMIN_PASSWORD}
#
# core.ldap.baseDN
#    The root DN of the LDAP tree. All other DNs below are relative to this.
#
# core.ldap.rodaGuestDN / core.ldap.rodaAdminDN / core.ldap.rodaAdministratorsDN
#    Well-known distinguished names for the built-in guest user, admin
#    user, and administrators group. These must exist in the LDAP tree.
##########################################################################

core.ldap.url = ${env:LDAP_SERVER_URL}
core.ldap.port = ${env:LDAP_SERVER_PORT}
core.ldap.adminDN = cn=admin,dc=roda,dc=org
core.ldap.adminPassword = eterna
core.ldap.baseDN = dc=roda,dc=org
core.ldap.peopleDN = ou=users,dc=roda,dc=org
core.ldap.groupsDN = ou=groups,dc=roda,dc=org
core.ldap.rolesDN = ou=roles,dc=roda,dc=org
core.ldap.rodaGuestDN = uid=guest,ou=users,dc=roda,dc=org
core.ldap.rodaAdminDN = uid=admin,ou=users,dc=roda,dc=org
core.ldap.rodaAdministratorsDN = cn=administrators,ou=groups,dc=roda,dc=org

# Users and groups that the UI cannot modify or delete, because they are
# required for the repository to function correctly.
#core.ldap.protectedUsers = admin
core.ldap.protectedUsers = guest
core.ldap.protectedGroups = administrators
#core.ldap.protectedGroups = archivists
#core.ldap.protectedGroups = producers
core.ldap.protectedGroups = users
core.ldap.protectedGroups = guests

##########################################################################
# HTTP Basic Auth settings
#
# Controls whether HTTP Basic Auth is accepted for the web interface and
# the REST API. Disable if you want to force all authentication through
# an external provider (e.g. CAS) and prevent any fallback to password
# authentication.
#
# core.web.basicAuth.disable / core.api.basicAuth.disable
#    Set to true to reject Basic Auth credentials entirely for the web
#    interface or API respectively. Default: false (Basic Auth allowed).
#
# core.web.basicAuth.whitelist[] / core.api.basicAuth.whitelist[]
#    Users that are always allowed to authenticate via Basic Auth even
#    when the corresponding disable flag is true. Typically "admin" for
#    emergency/maintenance access.
##########################################################################
core.web.basicAuth.disable = false
core.web.basicAuth.whitelist[] = admin
core.api.basicAuth.disable = false
core.api.basicAuth.whitelist[] = admin

##########################################################################
# Storage settings
#
# core.storage.type
#    Storage backend to use. Currently only FILESYSTEM is supported.
#
# core.storage.filesystem.trash
#    Sub-folder under RODA_HOME/data/ where deleted objects are moved.
#    Default: trash
#
# core.storage.filesystem.trash.enabled
#    When false, deleted objects are permanently removed instead of being
#    moved to the trash folder. Default: true (soft delete / trash).
#
# Folder scattering (optional):
# Distributes AIP directories across sub-folders to avoid large flat
# directories (performance degrades with many entries in one folder).
# Enable by pointing new_service to ScatteredFileStorageService and
# configuring one or more containers under core.storage.filesystem.
#
# Example: scatter the aip container using the first 4 chars of each UUID
#   core.storage.new_service = org.roda.core.storage.scatteredfs.ScatteredFileStorageService
#   core.storage.filesystem = aip
#   core.storage.filesystem.aip.scatter_method = ranges
#   core.storage.filesystem.aip.regex = ^[a-f0-9\\-]{36}$
#   core.storage.filesystem.aip.type = directory
#   core.storage.filesystem.aip.rule = 0-2,2-4
##########################################################################
core.storage.type=FILESYSTEM
#core.storage.filesystem.trash = trash
#core.storage.filesystem.trash.enabled = true
#core.storage.new_service = org.roda.core.storage.scatteredfs.ScatteredFileStorageService
#core.storage.filesystem = aip
#core.storage.filesystem.aip.scatter_method = ranges
#core.storage.filesystem.aip.regex = ^[a-f0-9\\-]{36}$
#core.storage.filesystem.aip.type = directory
#core.storage.filesystem.aip.rule = 0-2,2-4

##########################################################################
# Apache Solr settings
#
# core.solr.type
#    Always CLOUD — ETERNA requires Solr in SolrCloud mode with ZooKeeper.
#
# core.solr.cloud.urls
#    ZooKeeper connection string (host:port). For multiple ZooKeeper nodes
#    use comma-separated values: zk1:2181,zk2:2181,zk3:2181
#
# core.solr.cloud.connect.timeout_ms
#    How long (ms) to wait for ZooKeeper to become available on startup.
#    Default: 60000 (60 seconds).
#
# core.solr.cloud.healthcheck.retries / healthcheck.timeout_ms
#    Number of times and how long to wait per attempt when checking that
#    Solr is ready before ETERNA proceeds. Total max wait =
#    retries × timeout_ms = 100 × 10000 = ~17 minutes.
#    Reduce retries for faster startup failure in dev environments.
#
# core.solr.stemming.language
#    Language code for stemming and stopwords on full-text (*_txt) fields.
#    Setting this improves search relevance for the archive's primary
#    language (e.g. sv for Swedish). Without it, Solr uses text_general
#    (no language-specific stemming). See available codes below.
#
# Available language codes (from index/common/conf/managed_schema):
#   ar - Arabic,      bg - Bulgarian,    ca - Catalan,    cz - Czech,
#   da - Danish,      de - German,       el - Greek,      es - Spanish,
#   eu - Basque,      fa - Persian,      fi - Finnish,    fr - French,
#   ga - Irish,       gl - Galician,     hi - Hindi,      hu - Hungarian,
#   hy - Armenian,    id - Indonesian,   it - Italian,    lv - Latvian,
#   nl - Dutch,       no - Norwegian,    pt - Portuguese, ro - Romanian,
#   ru - Russian,     sv - Swedish,      th - Thai,       tr - Turkish,
#   ja - Japanese (morphological),  cjk - CJK bigram (Chinese/Japanese/Korean)
##########################################################################
core.solr.type=CLOUD
core.solr.cloud.urls=localhost:2181
core.solr.cloud.connect.timeout_ms=60000
core.solr.cloud.healthcheck.retries=100
core.solr.cloud.healthcheck.timeout_ms=10000

#core.solr.stemming.language=sv

##########################################################################
# Orchestrator (Pekko-based job/plugin parallelism engine)
#
# core.orchestrator.max_jobs_in_parallel
#    Maximum number of jobs that can run simultaneously.
#    Default: number of CPU cores + 1. Adjust based on available hardware.
#
# core.orchestrator.max_limited_jobs_in_parallel
#    Maximum simultaneous jobs for the "limited" parallelism pool.
#    Used for resource-heavy plugins to prevent overload. Default: 1.
#
# core.orchestrator.nr_of_jobs_workers / nr_of_limited_jobs_workers
#    Number of Pekko worker actors for normal and limited pools.
#    Should match or be lower than the corresponding max_*_in_parallel.
#
# core.orchestrator.start_jobs_in_state_created
#    When true, jobs persisted in state CREATED are resumed automatically
#    on startup (useful after a crash). Default: true.
#
# core.orchestrator.block_size
#    Number of objects handed to each worker at a time. Smaller values
#    give more frequent progress updates; larger values reduce overhead.
#    Default: 100.
#
# core.orchestrator.sync_timeout
#    Seconds before a synchronous job execution times out. Default: 600.
#
# core.orchestrator.non_parallelizable_plugins
#    Plugins that must never run at the same time as each other.
#    Add one entry per plugin class. Move and Delete are here by default
#    to prevent data races.
#
# core.orchestrator.lock_request_timeout / lock_timeout
#    Seconds before an object lock request or held lock expires. Default: 600.
#
# core.orchestrator.internal_jobs_priority
#    Priority for system-initiated jobs. Values: HIGH | MEDIUM | LOW. Default: MEDIUM.
#
# core.orchestrator.internal_jobs_parallelism
#    Whether internal jobs use the full (NORMAL) or limited actor pool.
#    Values: NORMAL | LIMITED. Default: NORMAL.
##########################################################################
core.orchestrator.type=PEKKO
core.orchestrator.max_jobs_in_parallel = 8
core.orchestrator.max_limited_jobs_in_parallel = 2
core.orchestrator.nr_of_jobs_workers = 8
core.orchestrator.nr_of_limited_jobs_workers = 2
#core.orchestrator.start_jobs_in_state_created = true
core.orchestrator.block_size = 100
#core.orchestrator.sync_timeout = 600
core.orchestrator.non_parallelizable_plugins = org.roda.core.plugins.base.maintenance.MovePlugin
core.orchestrator.non_parallelizable_plugins = org.roda.core.plugins.base.maintenance.DeleteRODAObjectPlugin
#core.orchestrator.non_parallelizable_plugins = org.roda.core.plugins.base.ingest.v2.ConfigurableIngestPlugin
#core.orchestrator.non_parallelizable_plugins = org.roda.core.plugins.base.ingest.v2.MinimalIngestPlugin
#core.orchestrator.lock_request_timeout = 600
#core.orchestrator.lock_timeout = 600
#core.orchestrator.internal_jobs_priority = MEDIUM
#core.orchestrator.internal_jobs_parallelism = NORMAL

##########################################################################
# Distributed events (for multi-instance / clustered deployments)
#
# When multiple ETERNA instances share the same Solr/storage, enabling
# events ensures that index updates on one node are propagated to others
# via Pekko Distributed Data. For single-instance deployments, keep
# core.events.enabled = false.
#
# core.events.enabled
#    Enable or disable inter-instance event propagation. Default: false.
#
# core.events.notifier_and_handler_are_the_same
#    When true (default), the same class handles both sending and receiving
#    events, so it is instantiated only once.
#
# core.events.pekko.writeConsistency
#    How many nodes must acknowledge a distributed write before it is
#    considered successful. WriteMajority (default) requires quorum.
#    WriteAll requires every node. See Pekko Distributed Data docs:
#    https://pekko.apache.org/docs/pekko/current/typed/distributed-data.html
#
# core.events.pekko.writeConsistencyTimeoutInSeconds
#    Timeout (seconds) for a distributed write. A timeout does not mean the
#    write is lost — it may still propagate eventually. Default: 3.
##########################################################################
core.events.enabled = false
core.events.notifier_and_handler_are_the_same = true
core.events.notifier_class = org.roda.core.events.pekko.PekkoEventsHandlerAndNotifier
#core.events.handler_class =
core.events.pekko.writeConsistency = WriteMajority
core.events.pekko.writeConsistencyTimeoutInSeconds = 3


##########################################################################
# Ingest workflow settings
#
# core.ingest.sip2aip.create_submission
#    When true, the original SIP package is preserved inside the AIP
#    (in a submission/ sub-folder). Increases storage usage but provides
#    a full audit trail. Default: false.
#
# core.ingest.processed.move_when_autoaccept
#    When true, SIPs are automatically moved to the processed folder after
#    auto-accepted ingest. Default: false.
#
# core.ingest.processed.base_folder / successfully_ingested / unsuccessfully_ingested
#    Sub-folder names under the transferred-resources root where processed
#    SIPs are moved. Only relevant when move_when_autoaccept = true.
#
# core.ingest.delete_transfer_resource_after_successfully_ingested
#    When true, the source SIP is deleted from the transfer area after a
#    successful ingest. Default: false.
#
# core.ingest.skip.fix.parents
#    Skip the step that automatically resolves missing parent AIPs.
#    Default: false (parents are fixed automatically).
#
# core.premis.fixity.algorithms
#    Checksum algorithms computed for every file during ingest and stored
#    in PREMIS fixity metadata. Multiple algorithms can be listed.
#    Supported algorithms: https://docs.oracle.com/javase/8/docs/technotes/guides/security/StandardNames.html#MessageDigest
##########################################################################
#core.ingest.sip2aip.create_submission=false
#core.ingest.processed.move_when_autoaccept = false
#core.ingest.processed.base_folder=PROCESSED
#core.ingest.processed.successfully_ingested=SUCCESSFULLY_INGESTED
#core.ingest.processed.unsuccessfully_ingested=UNSUCCESSFULLY_INGESTED
#core.ingest.delete_transfer_resource_after_successfully_ingested=false
#core.ingest.skip.fix.parents=true
core.premis.fixity.algorithms = MD5
core.premis.fixity.algorithms = SHA-1
core.premis.fixity.algorithms = SHA-256

##########################################################################
# Transfer area (ingest drop folder)
#
# Folder path, relative to RODA_HOME/data/, where SIP packages are placed
# before ingest. Files in this folder appear in the Ingest > Transfer UI.
# The folder is created automatically if it does not exist.
##########################################################################
transferredResources.folder = transferred-resources

##########################################################################
# Email / SMTP settings
#
# Used for sending ingest notifications and system alerts.
#
# WARNING: The default values below are for a local dev SMTP server
# (e.g. MailHog/Mailpit on port 1025). They must be updated for any
# real deployment.
#
# core.email.from / core.email.user
#    Sender address and SMTP login username. Update to your organisation's
#    no-reply address (e.g. noreply@example.se).
#
# core.email.host / core.email.port
#    SMTP server address and port.
#    Common values: 25 (plain), 587 (STARTTLS), 465 (SMTPS).
#
# core.email.auth / core.email.starttls.enable
#    Set auth = true and provide a password when the SMTP server requires
#    authentication. Enable starttls for STARTTLS-based connections.
#
# core.email.properties / core.email.<x>
#    Pass arbitrary JavaMail session properties. List property names under
#    core.email.properties, then set each value as core.email.<name> = <value>.
##########################################################################
core.email.from = noreply@example.se
core.email.user = noreply@example.se
#core.email.password = smtp_password
core.email.protocol = smtp
core.email.host = 127.0.0.1
core.email.port = 1025
#core.email.auth = true
#core.email.starttls.enable = true

#core.email.properties = x
#core.email.x = y


##########################################################################
# Notification e-mail settings
#
# core.notification.acknowledge
#    URL template for acknowledge links included in notification e-mails.
#    {notificationId} and {token} are replaced at runtime.
#    UPDATE this to your public-facing ETERNA URL before deploying.
#
# core.notification.template_path
#    Path (relative to RODA_HOME/config/) to the e-mail template directory.
#
# core.notification.ingest_subject / default_subject
#    Subject lines for ingest and generic process notifications.
#    {RESULT} is replaced with SUCCESS, FAILURE, or PARTIAL_SUCCESS.
#
# core.notification.package
#    Java package where built-in notification plugin implementations live.
#
# Per-plugin e-mail notifications (generic plugin hook):
#   parameter.notification.<ExceptionClassName>.enable = true
#   parameter.notification.<ExceptionClassName>.to = recipient@example.com
# These are read by PluginHelper and can be set for any plugin that
# triggers a GenericException-based notification.
##########################################################################
core.notification.acknowledge = http://localhost:8080/#acknowledge/{notificationId}/{token}
core.notification.template_path = mail/templates/
core.notification.ingest_subject = ETERNA ingest process avslutad - {RESULT}
core.notification.default_subject = ETERNA process avslutad - {RESULT}
core.notification.package = org.roda.core.plugins.base.notifications

# Example: send an e-mail when a generic exception is raised during a job
# parameter.notification.EmailGenericException.enable = true
# parameter.notification.EmailGenericException.to = admin@example.com

##########################################################################
# Full-text search settings
#
# core.index.fulltext_threshold_in_bytes
#    Files larger than this size (bytes) are not indexed for full-text
#    search. Default: 104857600 (100 MiB). Uncomment to override.
#
# core.index.preservation_event.enable
#    When true, PREMIS preservation events are indexed in Solr and
#    visible in the Preservation Events section of the UI. Default: true.
##########################################################################
#core.index.fulltext_threshold_in_bytes = 104857600

core.index.preservation_event.enable = true

##########################################################################
# Plugin / task general settings
#
# core.plugins.internal.package
#    Java package where built-in plugins are discovered at startup.
#
# core.plugins.internal.take_precedence_over_external
#    When true, a built-in plugin with the same class name as an external
#    one takes precedence. Default: true.
#
# core.plugins.external.scheduler.interval
#    How often (seconds) the plugin registry rescans the external plugin
#    directory for new or updated JARs. Default: 30.
#
# core.plugins.blacklist
#    Fully-qualified class names of plugins that should never be loaded.
#    Add one entry per line. PluginThatFailsDuringInit is blacklisted by
#    default to prevent startup failures from test plugins.
##########################################################################
core.plugins.internal.package = org.roda.core.plugins.base
core.plugins.internal.take_precedence_over_external = true
core.plugins.external.scheduler.interval = 30

#core.plugins.blacklist = org.roda.core.plugins.base.ingest.v2.MinimalIngestPlugin
#core.plugins.blacklist = org.roda.core.plugins.base.ingest.v2.ConfigurableIngestPlugin
#core.plugins.blacklist = org.roda.core.plugins.base.ingest.BagitToAIPPlugin
#core.plugins.blacklist = org.roda.core.plugins.base.ingest.EARKSIPToAIPPlugin
#core.plugins.blacklist = org.roda.core.plugins.base.ingest.TransferredResourceToAIPPlugin
core.plugins.blacklist = org.roda.core.plugins.base.PluginThatFailsDuringInit

##########################################################################
# Anti-virus plugin settings
#
# core.plugins.internal.virus_check.antiVirusClassname
#    Implementation class for virus scanning. ClamAntiVirus (default) uses
#    ClamAV in daemon mode via clamdscan. An AVG implementation is also
#    available (see commented block below).
#
# ClamAV (clamdscan) settings:
#   .bin        — Path to the clamdscan binary.
#                 Debian/Ubuntu: /usr/bin/clamdscan
#                 RHEL/Fedora:   /usr/bin/clamdscan  (or /usr/sbin/clamdscan)
#   .params     — Command-line flags passed to clamdscan.
#                 -m = multiscan (use all threads)
#                 --stream = pipe file data over TCP to the daemon instead
#                            of reading from the filesystem (required when
#                            ETERNA and ClamAV are in separate containers).
#   .get_version — Command used to detect the ClamAV version at startup.
##########################################################################
core.plugins.internal.virus_check.antiVirusClassname = org.roda.core.plugins.base.antivirus.ClamAntiVirus

core.plugins.internal.virus_check.clamav.bin = /usr/bin/clamdscan
core.plugins.internal.virus_check.clamav.params = -m --stream
core.plugins.internal.virus_check.clamav.get_version = clamdscan --version

#core.plugins.internal.virus_check.antiVirusClassname = org.roda.core.plugins.base.antivirus.AVGAntiVirus
#core.plugins.internal.virus_check.avg.bin = /usr/bin/avgscan
#core.plugins.internal.virus_check.avg.params = -repok -arc
#core.plugins.internal.virus_check.avg.get_version = /usr/bin/avgscan --version

##########################################################################
# Siegfried (file format identification) settings
#
# core.tools.siegfried.mode
#    server     — Siegfried runs as an HTTP server (recommended for Docker).
#                 ETERNA calls the server over HTTP; faster for large batches.
#    standalone — ETERNA invokes the sf binary directly for each file.
#                 Simpler setup but slower due to process-spawn overhead.
#
# core.tools.siegfried.server
#    URL of the Siegfried HTTP server. Only used when mode = server.
#    Read from environment variable in Docker deployments.
#
# core.tools.siegfried.binary
#    Path to the sf binary. Only used when mode = standalone.
##########################################################################
core.tools.siegfried.mode = ${env:SIEGFRIED_MODE}
core.tools.siegfried.server = ${env:SIEGFRIED_SERVER_URL}

#core.tools.siegfried.mode = server

# Alternative standalone mode (not recommended for production)
#core.tools.siegfried.mode = standalone
#core.tools.siegfried.binary = sf


