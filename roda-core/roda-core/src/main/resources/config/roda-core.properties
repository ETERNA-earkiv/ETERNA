core.representation_type.value: SMURF
core.representation_type.value: SMURFERMS
core.representation_type.value: SMURFSFSB
core.representation_type.value: OTHER

##########################################################################
# AIP type vocabulary
#
# Same structure as representation_type above.
# core.aip_type.controlled_vocabulary = true to restrict to listed values.
##########################################################################
core.aip_type.controlled_vocabulary: false
core.aip_type.value: MIXED

##########################################################################
# Iterable index result settings
#
# These control the internal paging used when iterating over large Solr
# result sets during batch operations (e.g. reindex, export).
#
# core.index_result.page_size
#    Number of records fetched per Solr page. Default: 1000.
#
# core.index_result.retries
#    How many times to retry a failed Solr page fetch. Default: 100.
#
# core.index_result.sleep
#    Milliseconds to wait between retries. Default: 10000 (10 seconds).
##########################################################################
core.index_result.page_size: 1000
core.index_result.retries: 100
core.index_result.sleep: 10000

##########################################################################
# Repository-level preservation event access control
#
# Defines which user and group have read access to repository-level
# PREMIS events (events not tied to a specific AIP). These events are
# stored with these permissions baked in at creation time.
##########################################################################
core.permission.repository_events.user: admin
core.permission.repository_events.group: administrators
#core.permission.repository_events.group: users


##########################################################################
# Disposal bin
#
# Folder (relative to RODA_HOME/data/) where AIPs destroyed via a
# disposal schedule are moved before permanent deletion.
# Kept separate from the regular trash to allow audit reporting.
##########################################################################
disposal_bin.folder = disposal-bin


##########################################################################
# Disposal confirmation report command
#
# Shell command used to generate the JSON disposal confirmation report.
# Requires jq (https://stedolan.github.io/jq/) to be installed on the
# server running ETERNA. The placeholders {{metadataFile}}, {{aipsFile}},
# {{schedulesFile}}, and {{holdsFile}} are replaced at runtime with
# paths to temporary JSON files.
##########################################################################
core.confirmation.generate.report.command = jq -n --slurpfile metadata {{metadataFile}} --slurpfile aips {{aipsFile}} --slurpfile schedules {{schedulesFile}} --slurpfile holds {{holdsFile}} {metadata:$metadata[0],aips:$aips,schedules:$schedules,holds:$holds}

##########################################################################
# Action log synchronization (Primary/Replica mode)
#
# Used when one ETERNA instance acts as a primary and another as a
# replica for action-log aggregation. The replica reads log entries
# from the primary via the REST API and writes them to its own Solr index.
#
# Leave all entries commented out for standard single-instance deployments.
# NOTE: Do not store plain-text passwords here in production — use
# environment variables or a secrets manager instead.
##########################################################################
#core.action_logs.primary.user = admin
#core.action_logs.primary.pass = eterna
#core.action_logs.primary.url = http://localhost:8080
#core.action_logs.primary.resource = /api/v1/log_entries
#core.action_logs.replica.write.solr = true


##########################################################################
# Protocol registry settings
#
# Mirrors the plugin registry structure for storage/transfer protocols.
# Leave at defaults unless adding custom protocol implementations.
##########################################################################
core.protocols.internal.package = org.roda.core.protocols.protocols
core.protocols.internal.take_precedence_over_external = true
core.protocols.external.scheduler.interval = 30

##########################################################################
# Local/Central synchronization — bundle path
#
# When ETERNA runs in a distributed Local + Central topology, this is
# the path (relative to RODA_HOME) where synchronization bundles are
# staged before transfer to the central instance.
##########################################################################
#core.synchronization.bundle.path = data/synchronization/bundle

##########################################################################
# Local/Central synchronization — preservation action execution mode
#
# Controls how preservation actions requested by the central instance
# are handled by the local instance.
#
# APPROVAL (default)
#    A human operator on the local instance must review and approve
#    each preservation action before it runs. Use when governance
#    requires manual sign-off.
#
# SCHEDULE
#    Actions are scheduled automatically according to
#    core.synchronization.scheduleInfo (see below). Use when the
#    central instance is trusted to trigger actions autonomously.
##########################################################################
core.synchronization.preservationActionExecution.type=APPROVAL

##########################################################################
# Local/Central synchronization — schedule
#
# Cron expression controlling how often the local instance synchronizes
# with the central instance.
# Format: minute hour day-of-month month day-of-week
# Default: 0 0 * * *  (once daily at midnight)
##########################################################################
core.synchronization.scheduleInfo=0 0 * * *

##########################################################################
# AIP edit locking
#
# When true, an AIP is locked for exclusive editing while a user is
# modifying its descriptive metadata, preventing concurrent edits.
# When false (default), no lock is acquired and concurrent edits are
# possible (last write wins).
##########################################################################
core.aip.lockToEdit=false

##########################################################################
# Default AIP permissions
#
# Controls which permissions are automatically assigned to newly created
# AIPs. Three actors can receive permissions:
#   creator  — the user who ingested or created the AIP
#   admin    — explicitly named admin users / groups
#   group    — other named groups (archivists, producers, guests, …)
#
# Permission values: READ, CREATE, UPDATE, DELETE, GRANT
#
# The active lines below give the creator full permissions (READ, CREATE,
# UPDATE, DELETE, GRANT) and require at minimum READ + UPDATE.
# Uncomment and adjust the other blocks to implement a more fine-grained
# access control model.
##########################################################################
# Direct creator permissions
#core.aip.default_permissions.creator.user.permission[] = CREATE
#core.aip.default_permissions.creator.user.permission[] = UPDATE
#core.aip.default_permissions.creator.user.permission[] = READ

# Admin users or groups so AIPs can be administered
#core.aip.default_permissions.admin.user[] = admin
#core.aip.default_permissions.admin.group[] = administrators

#core.aip.default_permissions.admin.group[].administrators.permission[] = READ
#core.aip.default_permissions.admin.group[].administrators.permission[] = UPDATE
#core.aip.default_permissions.admin.group[].administrators.permission[] = CREATE
#core.aip.default_permissions.admin.group[].administrators.permission[] = GRANT
#core.aip.default_permissions.admin.group[].administrators.permission[] = DELETE

# Additional non-admin group permissions
#core.aip.default_permissions.group[] = archivists
#core.aip.default_permissions.group[] = producers
#core.aip.default_permissions.group[] = guests

#core.aip.default_permissions.group[].archivists.permission[] = READ
#core.aip.default_permissions.group[].archivists.permission[] = UPDATE
#core.aip.default_permissions.group[].archivists.permission[] = CREATE

#core.aip.default_permissions.group[].producers.permission[] = READ

#core.aip.default_permissions.group[].guests.permission[] = READ

# When true, only groups the creator belongs to receive permissions,
# intersected with the groups configured above.
#core.aip.default_permissions.intersect_groups = true

# Minimum permissions the system guarantees for the creator regardless of
# the configuration above (safety net — do not remove).
core.aip.default_permissions.creator.minimum.permissions[] = UPDATE
core.aip.default_permissions.creator.minimum.permissions[] = READ

# Default permissions granted to the creator (active configuration).
#core.aip.default_permissions.legacy_permissions = false
core.aip.default_permissions.creator.permission[] = READ
core.aip.default_permissions.creator.permission[] = CREATE
core.aip.default_permissions.creator.permission[] = UPDATE
core.aip.default_permissions.creator.permission[] = DELETE
core.aip.default_permissions.creator.permission[] = GRANT

##########################################################################
# Self-registration settings
#
# core.user_registration.disabled
#    NOTE: This is a double-negative property.
#    false (default) = self-registration is ENABLED — users can register
#                      their own accounts via the login page.
#    true            = self-registration is DISABLED — only admins can
#                      create accounts.
#
#    The UI counterpart (ui.register.active in roda-wui.properties) must
#    also be set to true for the registration form to appear. Both settings
#    must agree: this property controls the backend, the other the frontend.
##########################################################################
core.user_registration.disabled = false


##########################################################################
# External plugin certificate settings
#
# Controls TLS certificate trust for external plugin HTTP connections.
#
# core.plugins.external.certificates.opt-in
#    When true, external plugins must explicitly opt in to certificate
#    verification. Default: false (standard JVM trust store is used).
#
# core.plugins.external.certificates.custom.truststore.*
#    Configures a custom PKCS12 trust store for external plugin connections.
#    Place the trust store file in RODA_HOME/config/ and set:
#      .enable = true
#      .type   = PKCS12
#      .name   = <filename>
#      .pass   = <password>
##########################################################################
