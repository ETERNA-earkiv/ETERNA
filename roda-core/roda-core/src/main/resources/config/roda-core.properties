##########################################################################
# Storage legacy implementation
#
# Enables the legacy (non-transactional) implementation for storage operations.
#
# Set to 'true' to disable transactional behavior and use the legacy storage
# implementation, which does not provide transactional guarantees per AIP.
#
# Set to 'false' to use the transactional implementation (RODATransactionManager),
# which wraps entire ingest jobs in atomic transactions — meaning a single
# failing AIP causes the entire ingest batch to roll back.
#
# ETERNA decision (issue #279): This property is set to 'true' (legacy mode) because
# the transactional rollback behavior is unsuitable for large-scale ingest jobs.
# When ingesting thousands of AIPs, one invalid AIP must not abort the entire batch.
# Individual AIP failures are instead handled at the plugin/job level.
##########################################################################
core.storage.legacy.implementation.enabled = true

##########################################################################
# CAS group mapping (external authentication)
#
# When using CAS/SSO, maps external group attributes from the CAS server
# to internal ETERNA groups. This controls which ETERNA groups a CAS user
# is placed in based on the groups/attributes carried in their CAS ticket.
#
# core.authorization.external.group_mapping
#    Enable or disable CAS group mapping. Default: false.
#
# core.authorization.external.attribute
#    CAS attribute name containing the user's group memberships.
#    Default: memberOf
#
# Mapping configuration:
#   1. Declare a mapping name:
#      core.authorization.external.mappings[] = myMapping
#   2. Set the regex matching CAS group names to capture:
#      core.authorization.external.mapping.myMapping.external.group = casGroup\\d+
#   3. Set the internal ETERNA groups to assign matched users to:
#      core.authorization.external.mapping.myMapping.internal.groups[] = archivists
#      core.authorization.external.mapping.myMapping.internal.groups[] = users
##########################################################################
# core.authorization.external.group_mapping = true
# core.authorization.external.attribute = memberOf
# core.authorization.external.mappings[] = sampleCasMapping1
# core.authorization.external.mapping.sampleCasMapping1.external.group = sampleCasGroup\\d+
# core.authorization.external.mapping.sampleCasMapping1.internal.groups[] = administrators
# core.authorization.external.mapping.sampleCasMapping1.internal.groups[] = users

##########################################################################
# PDF redaction settings
#
# ui.redaction.reason.mandatory
#    When true, the user must provide a reason before a PDF redaction can
#    be saved. Default: true.
##########################################################################
ui.redaction.reason.mandatory = true
