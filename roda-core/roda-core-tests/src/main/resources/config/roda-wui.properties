ui.search.fields.IndexedAIP = reference
ui.search.fields.IndexedAIP.title.fields = title
ui.search.fields.IndexedAIP.title.type = text
ui.search.fields.IndexedAIP.reference.fields = unitId_txt
ui.search.fields.IndexedAIP.reference.type = text
ui.disposal.rule.blacklist.condition = reference
