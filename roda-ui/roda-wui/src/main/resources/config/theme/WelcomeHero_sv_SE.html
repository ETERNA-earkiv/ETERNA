<section class="eterna-welcome__hero">
  <p class="eterna-welcome__greeting-label">God dag</p>
  <h1 class="eterna-welcome__greeting">Välkommen till ETERNA</h1>

  <div class="eterna-welcome__search" role="search">
    <div class="eterna-welcome__search-scope">
      <span>I arkivet</span>
      <select id="eterna-welcome-scope">
        <option value="all">Allt</option>
        <option value="catalogue">Katalog</option>
        <option value="deliveries">Leveranser</option>
      </select>
    </div>
    <input class="eterna-welcome__search-input" type="search" id="eterna-welcome-q"
           placeholder="Sök i arkivet…" aria-label="Sök" />
    <a class="btn-eterna-primary" href="#search" id="eterna-welcome-submit">Sök</a>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('eterna-welcome-submit');
    var inp = document.getElementById('eterna-welcome-q');
    if(btn && inp) {
      btn.addEventListener('click', function(e){
        var q = inp.value.trim();
        if(q) { e.preventDefault(); window.location.hash = 'search?query=' + encodeURIComponent(q); }
      });
    }
  })();
  </script>
</section>
