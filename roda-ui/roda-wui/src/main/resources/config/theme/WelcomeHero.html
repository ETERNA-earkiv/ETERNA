<section class="eterna-welcome__hero">
  <p class="eterna-welcome__greeting-label">Good day</p>
  <h1 class="eterna-welcome__greeting">Welcome to ETERNA</h1>

  <div class="eterna-welcome__search" role="search">
    <div class="eterna-welcome__search-scope">
      <span>In the archive</span>
      <select id="eterna-welcome-scope-en">
        <option value="all">All</option>
        <option value="catalogue">Catalogue</option>
        <option value="deliveries">Deliveries</option>
      </select>
    </div>
    <input class="eterna-welcome__search-input" type="search" id="eterna-welcome-q-en"
           placeholder="Search the archive…" aria-label="Search" />
    <a class="btn-eterna-primary" href="#search" id="eterna-welcome-submit-en">Search</a>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('eterna-welcome-submit-en');
    var inp = document.getElementById('eterna-welcome-q-en');
    if(btn && inp) {
      btn.addEventListener('click', function(e){
        var q = inp.value.trim();
        if(q) { e.preventDefault(); window.location.hash = 'search?query=' + encodeURIComponent(q); }
      });
    }
  })();
  </script>
</section>
