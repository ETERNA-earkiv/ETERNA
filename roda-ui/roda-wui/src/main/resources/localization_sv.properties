# Shadows it.burning:cron-expression-descriptor:1.2.10 localization_sv.properties
# ResourceBundle does NOT merge bundles — our file on target/classes/ wins entirely.
# ALL 78 keys must be present; a missing key falls back to English, not Swedish.
#
# Intentional deviations from upstream:
#   SUN-SAT                   Titelbokstav         -> gemener (mid-sentence)
#   JAN-DEC                   Titelbokstav         -> gemener (svenska skriver manadsnamn med liten bokstav)
#   ComaOnlyOnX0              ", bara pa %s"       -> ", varje %s"
#   ComaOnDayX0OfTheMonth     ", dag %s i manaden" -> ", den %s:e varje manad"
#   EveryHour                 "varje timme"        -> "Varje timme"  (standalone rubrik)
#   EveryMinute               "varje minut"        -> "Varje minut"
#   EveryMinuteBetweenX0AndX1 "varje minut..."     -> "Varje minut..." (kan sta ensam)
#   EverySecond               "varje sekund"       -> "Varje sekund"
#
# Upgrade procedure: when bumping cron-expression-descriptor, run:
#   jar -xf <new-jar> localization_sv.properties
#   diff localization_sv.properties roda-ui/roda-wui/src/main/resources/localization_sv.properties
# Add any new keys and keep the intentional overrides listed above.

