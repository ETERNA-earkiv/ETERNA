name: 'Release'

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip deploy, Docker push, and release upload (build and test still run)'
        type: boolean
        default: true

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      zookeeper:
        image: zookeeper:3.9.1-jre-17
        ports:
          - 2181:2181
      solr:
        image: solr:9
        ports:
          - 8983:8983
        env:
          ZK_HOST: zookeeper:2181
        options: -e cloud

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set up Maven
        run: |
          MVN_VERSION=3.9.10
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
            -o /tmp/apache-maven-${MVN_VERSION}-bin.tar.gz
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz.sha512" \
            -o /tmp/apache-maven-${MVN_VERSION}-bin.tar.gz.sha512
          (cd /tmp && echo "$(cat apache-maven-${MVN_VERSION}-bin.tar.gz.sha512)  apache-maven-${MVN_VERSION}-bin.tar.gz" | sha512sum -c -)
          sudo tar -xz -C /opt -f /tmp/apache-maven-${MVN_VERSION}-bin.tar.gz
          sudo ln -sf /opt/apache-maven-${MVN_VERSION}/bin/mvn /usr/local/bin/mvn
      - name: Cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Set up GO
        uses: actions/setup-go@v6
        with:
          go-version: '^1.22.1'
          check-latest: true
      - name: Install siegfried
        run: |
          go install github.com/richardlehane/siegfried/cmd/sf@latest
          sf -update
      - name: Install clamdscan mock
        run: |
          sudo cp .github/workflows/bin/clamscan /usr/bin/clamscan
          sudo cp .github/workflows/bin/clamscan /usr/bin/clamdscan
          sudo chmod a+rx /usr/bin/clamscan /usr/bin/clamdscan
      - name: Get release version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "release_version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "release_version=$(mvn -f pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          fi
      - name: Run tests & install
        run:
          mvn $MAVEN_CLI_OPTS -Dtestng.groups="travis" clean org.jacoco:jacoco-maven-plugin:prepare-agent install
        env:
          RODA_CORE_SOLR_TYPE: CLOUD
          RODA_CORE_SOLR_CLOUD_URLS: localhost:2181
      - name: Deploy to GitHub packages
        if: ${{ !inputs.dry_run }}
        run: mvn $MAVEN_CLI_OPTS deploy -Dmaven.test.skip=true -Pcore
      - name: Copy target to docker context
        run: |
          mkdir -p docker/target
          cp -r roda-ui/roda-wui/target/roda-wui-${{ env.release_version }}/* docker/target
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/ETERNA-earkiv/ETERNA
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
          flavor: |
            latest=false
      - name: Set up QEMU
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docker image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          push: true
          context: docker
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload artifact to release
        if: ${{ !inputs.dry_run }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: roda-ui/roda-wui/target/roda-wui-${{ env.release_version }}.war
          asset_name: roda-wui-${{ env.release_version }}.war
          tag: ${{ github.ref }}
          release_name: ${{ github.ref_name }}
          draft: true
          body: |
            #### New features 
            
            #### Enhancements 
            
            #### Bug fixes
            
            #### Security
            
            ---
            
            To try out this version, check the [install instructions](https://github.com/ETERNA-earkiv/ETERNA/blob/main/deploys/standalone/README.md).
