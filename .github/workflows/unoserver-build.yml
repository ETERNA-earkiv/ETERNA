name: 'Unoserver Build'

on:
  push:
    branches:
      - "main"
    paths:
      - "deploys/standalone/unoserver/Dockerfile"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  unoserver-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unoserver image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./deploys/standalone/unoserver
          file: ./deploys/standalone/unoserver/Dockerfile
          # Bump the immutable version tag below whenever the image changes
          # (e.g. a new unoserver version or Dockerfile change), then pin the
          # deploy compose files to the new tag.
          tags: |
            ghcr.io/eterna-earkiv/eterna-unoserver:latest
            ghcr.io/eterna-earkiv/eterna-unoserver:v3.7.0
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
