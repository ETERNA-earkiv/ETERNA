name: 'Unoserver Build'

on:
  push:
    branches:
      - "main"
    paths:
      - "deploys/standalone/unoserver/Dockerfile"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  unoserver-build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/eterna-earkiv/eterna-unoserver
      # Bump this immutable version tag whenever the image changes (e.g. a new
      # unoserver version or Dockerfile change), then pin the deploy compose
      # files to the new tag. The guard step below refuses to overwrite an
      # existing tag, so a forgotten bump fails the build instead of silently
      # remapping the tag to a different image.
      VERSION_TAG: v3.7.0

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version tag is not already published
        run: |
          if docker manifest inspect "${IMAGE}:${VERSION_TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION_TAG} already exists in the registry. Bump VERSION_TAG before rebuilding so the immutable tag is never overwritten."
            exit 1
          fi
          echo "${IMAGE}:${VERSION_TAG} not found in registry; proceeding with build."

      - name: Build and push unoserver image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./deploys/standalone/unoserver
          file: ./deploys/standalone/unoserver/Dockerfile
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
