name: 'Release (macOS ARM64)'

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - "**"

permissions:
  actions: write
  checks: write
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
      - name: Set up Maven
        uses: hb0730/maven-action@v1
        with:
          maven-version: 3.9.10
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Set up GO
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22.1'
          check-latest: true
      - name: Install siegfried
        run: |
          go install github.com/richardlehane/siegfried/cmd/sf@latest
          sf -update
      - name: Install clamdscan mock
        run: |
          sudo cp .github/workflows/bin/clamscan $(brew --prefix)/bin/clamscan
          sudo cp .github/workflows/bin/clamscan $(brew --prefix)/bin/clamdscan
          sudo chmod a+rx $(brew --prefix)/bin/clamscan $(brew --prefix)/bin/clamdscan
      - name: Install ZooKeeper and Solr
        run: brew install zookeeper solr
      - name: Start ZooKeeper
        run: |
          zkServer start
          for i in $(seq 1 30); do
            echo ruok | nc -w1 localhost 2181 | grep -q imok && break
            sleep 2
          done
      - name: Start Solr
        run: |
          solr start -c -z localhost:2181 -p 8983
          for i in $(seq 1 30); do
            curl -sf http://localhost:8983/solr/admin/info/system && break
            sleep 2
          done
      - name: Get release version
        run: echo "release_version=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Run tests & install
        run:
          mvn $MAVEN_CLI_OPTS -Dtestng.groups="travis" -Denforcer.skip=true clean org.jacoco:jacoco-maven-plugin:prepare-agent install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RODA_CORE_SOLR_TYPE: CLOUD
          RODA_CORE_SOLR_CLOUD_URLS: localhost:2181
      - name: Upload artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: roda-ui/roda-wui/target/roda-wui-${{ env.release_version }}.war
          asset_name: roda-wui-${{ env.release_version }}-macos-arm64.war
          tag: ${{ github.ref }}
          overwrite: true
