name: 'Test Build'

# The automatic push trigger on "main" was removed so that merges to the
# stable/release branch don't publish test images. Push builds now run on
# "dev-1.x" instead.
on:
  workflow_dispatch:
  push:
    branches:
      - dev-1.x

permissions:
  actions: write
  attestations: write
  checks: write
  contents: read
  deployments: write
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.10

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up GO
        uses: actions/setup-go@v6
        with:
          go-version: '^1.22.1'
          check-latest: true

      - name: Install siegfried
        run: |
          go install github.com/richardlehane/siegfried/cmd/sf@latest
          sf -update

      - name: Install clamdscan mock
        run: |
          sudo cp .github/workflows/bin/clamscan /usr/bin/clamscan
          sudo cp .github/workflows/bin/clamscan /usr/bin/clamdscan
          sudo chmod a+rx /usr/bin/clamscan /usr/bin/clamdscan

      - name: Get test version info
        run: |
          echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Build & install (skip tests)
        run: |
          mvn $MAVEN_CLI_OPTS -DskipTests=true -Denforcer.skip=true clean install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RODA_CORE_SOLR_TYPE: CLOUD
          RODA_CORE_SOLR_CLOUD_URLS: localhost:2181
          SIEGFRIED_MODE: standalone
          LDAP_SERVER_URL: ldap://localhost
          LDAP_SERVER_PORT: 1389
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/roda_core_db

      - name: Deploy SNAPSHOT to GitHub Packages
        run: mvn $MAVEN_CLI_OPTS deploy -Dmaven.test.skip=true -Pcore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy JAR to Docker build context
        run: |
          mkdir -p docker/target
          cp roda-ui/roda-wui/target/roda-wui-*.jar docker/target/

      - name: Docker meta for test images
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/eterna-earkiv/eterna
          tags: |
            type=raw,value=test-${{ env.branch_name }}-{{date 'YYYYMMDD'}}-${{ env.commit_sha }}
            type=raw,value=test-${{ env.branch_name }}-latest
            type=raw,value=latest-test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: docker
          file: ./docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image availability
        run: |
          echo "Test image built and available at:"
          echo "${{ steps.meta.outputs.tags }}"
